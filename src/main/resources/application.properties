spring.application.name=24023
server.port=8080

# Неизвестные поля в JSON -> 400 Bad Request.
# Защита от mass assignment: клиент не сможет передать id, createdAt и т.п.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Не отдавать клиенту стек-трейсы и внутренние сообщения ошибок
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
